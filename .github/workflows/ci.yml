name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .cache/hex
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'rules/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: make image

      - run: make deps

      - run: make check

  release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: make release-smoke
